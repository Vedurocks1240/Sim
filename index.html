function dial(cx_,t){x.save();x.translate(cx_,80);x.beginPath();x.arc(0,0,70,0,7);x.fillStyle="#0b1118";x.fill();x.strokeStyle="#3a4a5c";x.lineWidth=3;x.stroke();x.fillStyle="#8aa0b5";x.font="10px sans-serif";x.textAlign="center";x.fillText(t,0,-24)}
function needle(an,len,w,c){x.save();x.rotate(an);x.strokeStyle=c||"#fff";x.lineWidth=w;x.beginPath();x.moveTo(0,8);x.lineTo(0,-len);x.stroke();x.restore()}
function tick(an,l0,l1,lab,fs){x.save();x.rotate(an);x.strokeStyle="#aab";x.lineWidth=1.5;x.beginPath();x.moveTo(0,-l0);x.lineTo(0,-l1);x.stroke();if(lab!=null){x.fillStyle="#cfe";x.font=(fs||10)+"px sans-serif";x.fillText(lab,0,-l1+11)}x.restore()}
function inst(){const vk=S.spd*1.944,Mc=S.spd/ISA(S.h).a,al=S.h*3.281,vs=S.spd*Math.sin(S.gam*D)*196.85;x.clearRect(0,0,780,178);
 dial(80,"AIRSPEED kt");for(let i=0;i<=10;i++)tick((-135+i*27)*D,62,54,i%2?null:Math.round(A.vn*i/10),9);
 needle((-135+cl(vk/A.vn,0,1)*270)*D,50,3,"#ffb020");x.fillStyle="#fff";x.font="13px monospace";x.fillText(Math.round(vk),0,32);x.fillStyle="#8aa0b5";x.font="10px sans-serif";x.fillText("M "+Mc.toFixed(2),0,46);x.restore();
 dial(235,"");x.save();x.beginPath();x.arc(0,0,66,0,7);x.clip();x.rotate(-S.roll*D);const py=S.pitch*2.4;
 x.fillStyle="#2a79c9";x.fillRect(-90,-200+py,180,200);x.fillStyle="#7a5230";x.fillRect(-90,py,180,200);
 x.strokeStyle="#fff";x.fillStyle="#fff";x.lineWidth=2;x.beginPath();x.moveTo(-90,py);x.lineTo(90,py);x.stroke();x.lineWidth=1;x.font="9px sans-serif";
 for(let p=-30;p<=30;p+=10){if(!p)continue;const y=py-p*2.4,w=p%20?14:26;x.beginPath();x.moveTo(-w,y);x.lineTo(w,y);x.stroke();x.fillText(Math.abs(p),w+9,y+3)}x.restore();
 x.strokeStyle="#ffb020";x.lineWidth=3;x.beginPath();x.moveTo(-30,0);x.lineTo(-10,0);x.lineTo(0,8);x.lineTo(10,0);x.lineTo(30,0);x.stroke();x.restore();
 dial(390,"ALT ft");for(let i=0;i<10;i++)tick(i*36*D,62,54,i);needle((al%10000)/10000*2*Math.PI,34,4);needle((al%1000)/1000*2*Math.PI,50,2);
 x.fillStyle="#fff";x.font="12px monospace";x.fillText(Math.round(al),0,34);x.fillStyle="#8aa0b5";x.font="10px sans-serif";x.fillText("AGL "+Math.round((S.h-gH)*3.281),0,47);x.restore();
 dial(545,"HDG");x.save();x.rotate(-S.hdg*D);for(let i=0;i<36;i++)tick(i*10*D,64,i%3?58:52,i%3?null:(i%9?String(i):"NESW"[i/9]),11);x.restore();
 x.fillStyle="#fff";x.beginPath();x.moveTo(0,-14);x.lineTo(7,10);x.lineTo(0,5);x.lineTo(-7,10);x.fill();x.fillStyle="#ffb020";x.beginPath();x.moveTo(0,-69);x.lineTo(-5,-77);x.lineTo(5,-77);x.fill();
 x.fillStyle="#fff";x.font="12px monospace";x.fillText(String(Math.round(S.hdg)%360).padStart(3,"0")+"°",0,38);x.restore();
 dial(700,"V/S ×1000 fpm");for(let i=-4;i<=4;i++)tick((-90+i*30)*D,62,54,Math.abs(i));needle((-90+cl(vs/4000,-1,1)*120)*D,50,3,"#7be07b");x.fillStyle="#fff";x.font="12px monospace";x.fillText(Math.round(vs),0,34);x.restore();
 x.textAlign="center";x.fillStyle="#cfe";x.font="13px monospace";x.fillText(`THR ${Math.round(S.thr*100)}%   G ${(S.g||1).toFixed(1)}   TRIM ${Math.round(S.trim*100)}   FLAPS ${S.flaps}   FUEL ${Math.round(S.fuel)}kg`,390,172)}
function hud(){const f=A.f;$("#hud").textContent=A.n+"\n"+[S.eng?'ENG':'ENG-OFF',S.gear?(A.rocket?'LEGS':'GEAR'):'',S.flaps?'FLAPS'+S.flaps:'',S.airbrake?'AIRBRAKE':'',S.brk?'BRAKE':'',S.park?'PARK':'',S.ap?'AP':'',S.acc?f.acc:'',S.part?f.part:'',S.ptt?'PTT':'',S.stall?'STALL':''].filter(Boolean).join(' · ')+`\nB ${f.air?'airbrake':'—'} · Z ${f.acc||'—'} · X ${f.part||'—'}${A.stovl?' · NOZ '+Math.round(S.noz)+'°':''}${S.eng?'':' · NO FUEL/ENG'}`;inst()}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(frame)}
// ---------- phone pairing (same protocol as the extension) ----------
function onPhone(m){if(m.t=='axes'){ph={r:m.roll,p:m.pitch,y:m.yaw};phT=performance.now();if(typeof m.throttle=='number'&&Math.abs(m.throttle-lastPT)>.001){S.thr=m.throttle;lastPT=m.throttle}}
 else if(m.t=='btn')act(m.name,1);else if(m.t=='key')act(m.name,m.down)}
let big=false,ctl=null,pinfo={},waitCtl=false;   // big = dedicated "second phone" mode; waitCtl = sim paused until a controller connects
function showPair(st){const b=$("#pair");
 if(st=='ok'){b.className="p chip";b.innerHTML="📱 ●";b.style.display="block";return}
 b.className="p"+(big?" big":"");
 b.innerHTML=`<b>${st=='lost'?'Controller disconnected':'Connect a controller phone'}</b><div class="qr">${pinfo.svg}</div><div class="code">${pinfo.id}</div>`+
 (big?`<small>1. On the controller phone, scan the QR (or open<br><b>${pinfo.base}</b><br>and type the code).<br>2. When it says connected, the flight starts.</small><br><button id="nc" style="margin-top:10px">Fly without a controller</button>`:'');
 b.style.display="block";if(big)$("#nc").onclick=()=>{waitCtl=false;showPair('ok')}}
function pair(){const id="geofs-"+Math.random().toString(36).slice(2,8),p=new Peer(id);
 p.on("open",()=>{const base=new URL("controller.html",location.href).href,q=qrcode(0,"M");q.addData(base+"#"+id);q.make();pinfo={id,base,svg:q.createSvgTag({cellSize:3,scalable:true})};showPair('wait')});
 p.on("error",e=>$("#pair").insertAdjacentHTML("beforeend","<br><small>Pairing error: "+e.type+"</small>"));
 p.on("connection",c=>{if(ctl)ctl.close();ctl=c;const up=()=>{waitCtl=false;showPair('ok')};c.open?up():c.on("open",up);
  c.on("data",onPhone);c.on("close",()=>{phT=0;if(ctl===c){if(big)waitCtl=true;showPair('lost')}})})}
// ---------- on-device mode: the controller page runs as a transparent overlay on this same screen ----------
function startTouch(){document.body.classList.add("touch");viewer.resolutionScale=.75;viewer.scene.globe.maximumScreenSpaceError=4;
 const f=document.createElement("iframe");f.id="tf";f.src="controller.html#local";f.allow="accelerometer; gyroscope; fullscreen";f.setAttribute("allowtransparency","true");document.body.appendChild(f)}
addEventListener("message",e=>{const m=e.data&&e.data.gpc;if(!m)return;
 if(m.t=="fs"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen({navigationUI:"hide"}).then(()=>screen.orientation.lock("landscape")).catch(()=>{}).catch(()=>{})}
 else onPhone(m)});

 else o.baseLayer=new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",maximumLevel:19}));
 viewer=new Cesium.Viewer("c",o);viewer.scene.screenSpaceCameraController.enableInputs=false;viewer.scene.globe.depthTestAgainstTerrain=true;

 catch(e){const m=$("#msg");m.textContent="Buildings failed to load: check your ion token/assets";m.style.display="block";setTimeout(()=>m.style.display="none",5000)}
 plane=viewer.entities.add({model:{uri:glb(A.p,A.col),minimumPixelSize:0,scale:1}});
 reset();$("#hud").style.display="block";$("#ins").style.display="block";touch?startTouch():pair();requestAnimationFrame(frame)};
